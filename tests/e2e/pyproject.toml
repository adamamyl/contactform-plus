[project]
name = "emf-e2e-tests"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "schemathesis>=4.32.7",
    "pytest-playwright>=0.10.0",
    "pytest-asyncio>=1.4.1",
    "httpx>=0.28.1",
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
    "asyncpg>=0.32.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["e2e: end-to-end test against a running stack"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["schemathesis.*", "hypothesis.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
